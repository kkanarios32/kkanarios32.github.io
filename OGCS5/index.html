window.addEventListener('load', function () { setTimeout(function () {
  // Openers get the same treatment from the other side: left alone, the
  // paren in "(\(x\) or \(y\))" can hang at the end of a line.
  var CLOSE = /^[.,;:!?)\]}%'"’”…]+/;
  var OPEN = /[(\[{‘“]+$/;

  document.querySelectorAll('.katex').forEach(function (math) {
    // Display math is a block of its own; nothing can be orphaned beside it.
    if (math.closest('.katex-display')) return;

    // KaTeX's auto-render gives every formula a bare <span> of its own and
    // renders into that, so the text around a formula is a sibling of the
    // wrapper and not of .katex itself. Climb to the outermost span that
    // holds nothing but this formula, and treat that as the atom.
    var node = math;
    while (node.parentNode &&
           node.parentNode.childNodes.length === 1 &&
           node.parentNode.nodeName.toLowerCase() === 'span') {
      node = node.parentNode;
    }

    var before = node.previousSibling, after = node.nextSibling;
    var lead = '', trail = '';
    if (after && after.nodeType === 3 && CLOSE.test(after.data)) {
      trail = after.data.match(CLOSE)[0];
    }
    if (before && before.nodeType === 3 && OPEN.test(before.data)) {
      lead = before.data.match(OPEN)[0];
    }
    if (!lead && !trail) return;

    // createElementNS, not createElement: the page is an XML document that
    // the browser transforms with this stylesheet, and in an XML document
    // createElement yields an element in the null namespace — a <span> that
    // is not an HTML span, and that nothing styles.
    var glue = document.createElementNS('http://www.w3.org/1999/xhtml', 'span');
    glue.setAttribute('style', 'white-space: nowrap');
    node.parentNode.insertBefore(glue, node);
    if (lead) {
      before.data = before.data.slice(0, before.data.length - lead.length);
      glue.appendChild(document.createTextNode(lead));
    }
    glue.appendChild(node);
    if (trail) {
      after.data = after.data.slice(trail.length);
      glue.appendChild(document.createTextNode(trail));
    }
  });
}, 0); });

(function () {
  var LINE = 140;

  function init() {
    var nav = document.querySelector('nav#toc');
    if (!nav) return;

    var rows = [];
    Array.prototype.forEach.call(nav.querySelectorAll('[data-target^="#"]'), function (link) {
      var el = document.querySelector(link.getAttribute('data-target'));
      if (el) rows.push({ link: link, el: el });
    });
    if (!rows.length) return;

    var current = null, ticking = false;

    function update() {
      ticking = false;
      var found = null;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].el.getBoundingClientRect().top > LINE) break;
        found = rows[i].link;
      }
      if (found === current) return;
      if (current) current.removeAttribute('aria-current');
      if (found) found.setAttribute('aria-current', 'true');
      current = found;
      if (found) reveal(found);
    }

    // Keep the marked row inside the rail. The rail is capped at the viewport
    // and scrolls internally, so on a long contents the row being read drifts
    // out of sight and the highlight becomes useless — you can see that you
    // are somewhere, but not where.
    //
    // nav.scrollTop is set directly rather than calling scrollIntoView, which
    // walks up the ancestor chain and will scroll the window as readily as the
    // rail: the page would yank itself around while the reader is scrolling
    // it. Assigning scrollTop can move nothing but the rail. Nudged only when
    // the row is actually out of the band, so an entry already comfortably in
    // view does not cause the rail to twitch on every section boundary.
    function reveal(link) {
      var pad = 32;
      var railTop = nav.getBoundingClientRect().top;
      var railBottom = nav.getBoundingClientRect().bottom;
      var row = link.getBoundingClientRect();
      if (row.top < railTop + pad) {
        nav.scrollTop -= (railTop + pad) - row.top;
      } else if (row.bottom > railBottom - pad) {
        nav.scrollTop += row.bottom - (railBottom - pad);
      }
    }

    function schedule() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    }

    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', schedule);
    update();
  }

  if (document.readyState === 'complete') init();
  else window.addEventListener('load', init);
})();
